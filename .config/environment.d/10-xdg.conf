# ~/.config/environment.d/10-xdg.conf
#
# Environment for the systemd *user* session, read by
# systemd-environment-d-generator(7) when the user manager starts.
#
# Purpose: services started by systemd --user (e.g. syncthing.service) and
# anything they launch do not run through a login shell and therefore do not
# see ~/.profile. This gives them the same XDG layout as interactive shells.
#
# No shell expansion happens here (no ~, no $(...)), only environment.d(5)
# references such as $PATH; paths are therefore written out literally.
# Keep in sync with ~/.config/shell/env.sh, which documents the variables
# that are intentionally not mirrored (HISTFILE, PYTHON_HISTORY, ...).
#
# Changes take effect on next login (or: systemctl --user daemon-reexec).

XDG_CONFIG_HOME=/home/aibe/.config
XDG_DATA_HOME=/home/aibe/.local/share
XDG_STATE_HOME=/home/aibe/.local/state
XDG_CACHE_HOME=/home/aibe/.cache
XDG_SCREENSHOTS_DIR=/home/aibe/Pictures/Screenshots

EDITOR=nvim
VISUAL=nvim
BROWSER=firefox

RUSTUP_HOME=/home/aibe/.local/share/rustup
CARGO_HOME=/home/aibe/.local/share/cargo
GOPATH=/home/aibe/.local/share/go
DOTNET_CLI_HOME=/home/aibe/.local/share/dotnet
ANDROID_USER_HOME=/home/aibe/.local/share/android
PNPM_HOME=/home/aibe/.local/share/pnpm
WINEPREFIX=/home/aibe/.local/share/wine
NPM_CONFIG_CACHE=/home/aibe/.cache/npm
NPM_CONFIG_INIT_MODULE=/home/aibe/.config/npm/config/npm-init.js
_JAVA_OPTIONS=-Djava.util.prefs.userRoot=/home/aibe/.config/java
CODEX_HOME=/home/aibe/.config/codex
COPILOT_HOME=/home/aibe/.config/copilot

HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew
HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar
HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew
QT_QPA_PLATFORMTHEME=gtk3

# Same order as env.sh (last add_to_path entry ends up first).
PATH=/home/aibe/.local/share/pnpm/bin:/home/aibe/.local/share/fnm:/home/aibe/.local/share/JetBrains/Toolbox/scripts:/home/linuxbrew/.linuxbrew/sbin:/home/linuxbrew/.linuxbrew/bin:/home/aibe/.opencode/bin:/home/aibe/.local/bin:/home/aibe/.local/share/go/bin:/home/aibe/.local/share/cargo/bin:$PATH
