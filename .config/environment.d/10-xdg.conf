# ~/.config/environment.d/10-xdg.conf
#
# Environment for the systemd *user* session, read by
# systemd-environment-d-generator(7) when the user manager starts.
#
# Purpose: services started by systemd --user (e.g. syncthing.service) and
# anything they launch do not run through a login shell and therefore do not
# see ~/.profile. This gives them the same XDG layout as interactive shells.
#
# No shell expansion happens here (no ~, no $(...)), only environment.d(5)
# references such as ${HOME} and $PATH, so no username or UID is hardcoded.
# Keep in sync with ~/.config/shell/env.sh, which documents the variables
# that are intentionally not mirrored (HISTFILE, PYTHON_HISTORY, ...).
#
# Changes take effect on next login (or: systemctl --user daemon-reexec).

XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache
XDG_SCREENSHOTS_DIR=${HOME}/Pictures/Screenshots

EDITOR=nvim
VISUAL=nvim
BROWSER=firefox

RUSTUP_HOME=${HOME}/.local/share/rustup
CARGO_HOME=${HOME}/.local/share/cargo
GOPATH=${HOME}/.local/share/go
DOTNET_CLI_HOME=${HOME}/.local/share/dotnet
ANDROID_USER_HOME=${HOME}/.local/share/android
PNPM_HOME=${HOME}/.local/share/pnpm
WINEPREFIX=${HOME}/.local/share/wine
NPM_CONFIG_CACHE=${HOME}/.cache/npm
NPM_CONFIG_INIT_MODULE=${HOME}/.config/npm/config/npm-init.js
_JAVA_OPTIONS=-Djava.util.prefs.userRoot=${HOME}/.config/java
CODEX_HOME=${HOME}/.config/codex
COPILOT_HOME=${HOME}/.config/copilot
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket

HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew
HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar
HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew
QT_QPA_PLATFORMTHEME=gtk3

# Same order as env.sh (last add_to_path entry ends up first).
PATH=${HOME}/.local/share/pnpm/bin:${HOME}/.local/share/fnm:/home/linuxbrew/.linuxbrew/sbin:/home/linuxbrew/.linuxbrew/bin:${HOME}/.opencode/bin:${HOME}/.local/bin:${HOME}/.local/share/go/bin:${HOME}/.local/share/cargo/bin:$PATH
