# --- General Settings ---
set -g default-terminal "tmux-256color"

# Reset list options appended to below, so re-sourcing doesn't duplicate entries
set -su terminal-features
set -gu update-environment

# Modern terminal features and True Color (foot, xterm, etc.)
set -as terminal-features ",*:RGB:usstyle"
set -as terminal-features ",foot*:clipboard:ccolour:cstyle:focus:title:sixel"
set -gq allow-passthrough on

# Forward extended keys (Kitty keyboard protocol / CSI-u) to applications
# such as OpenCode, so combos like ctrl+alt+k can reach them.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'foot*:extkeys'
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g history-limit 50000

# Setup indices and terminal title
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string 'tmux: #S'
set -g mouse on

# Setup windows names
set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Bells and activity monitor
#set -g monitor-activity on
#set -g visual-activity off
#set -g monitor-bell on
#set -g bell-action any

# Setup clipboard
set -s set-clipboard on
set -s escape-time 0

# --- Keybindings ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vi like copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Jump between Claude Code prompts (lines starting with "❯ ").
# Alt+z = previous prompt, Alt+x = next prompt. Skips Claude's live input box.
bind -n M-z copy-mode -e \; send-keys -X -N 2 search-backward '^❯ '
bind -T copy-mode-vi M-z send-keys -X search-backward '^❯ '
bind -T copy-mode-vi M-x send-keys -X search-forward '^❯ '

# Jump between shell prompts (uses OSC 133 marks from foot.sh).
# [ / ] = previous/next prompt, ( / ) = start of previous/next command output.
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt
bind -T copy-mode-vi ( send-keys -X previous-prompt -o
bind -T copy-mode-vi ) send-keys -X next-prompt -o

# Alt+c = copy the last shell command's output (uses OSC 133 marks from foot.sh).
bind -n M-c copy-mode \; send -X previous-prompt -o \; send -X begin-selection \
    \; send -X next-prompt \; send -X cursor-up \; send -X end-of-line \
    \; send -X copy-selection-and-cancel

# Reload conf
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'niksingh710/minimal-tmux-status'

# Plugins Config
set -g @minimal-tmux-indicator-str "tmux"
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-bg green
set -g @minimal-tmux-status-right "[#S]"
# tmux 3.8 underlines the current window by default, which breaks the arrow pill
set -g window-status-current-style default

# TPM install
if "test ! -d ~/.config/tmux/plugins/tpm" \
   'run "git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins"'

# Initialize TMUX plugin manager (keep this at the very bottom)
run "~/.config/tmux/plugins/tpm/tpm"
