# Polkit agent: soteria (GTK4) instead of Fedora's lxqt-policykit-agent.
# Same filename as /usr/share/sway/config.d/95-autostart-policykit-agent.conf, so it replaces it.
# Built from ~/.local/src/soteria (cargo install --locked --path .)
# Its window rule: 50-rules-policykit-agent.conf
exec ~/.local/share/cargo/bin/soteria
