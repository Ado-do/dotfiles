# Sway appearance
gaps inner 6
gaps outer 4
smart_gaps on

default_border pixel 3
hide_edge_borders smart

# Titlebars (tabbed/stacking)
font pango:IosevkaTerm NF Medium 12
titlebar_padding 12 3

# Window colors: muted "faint" palette (matches waybar neutral pills)
#                       border   bg       text     indicator child_border
client.focused          #50506c  #2c2c3a  #d0d0dc  #7a7a96   #50506c
client.focused_inactive #2c2c3a  #24242e  #9a9ab0  #2c2c3a   #2c2c3a
client.unfocused        #24242e  #16161e  #9a9ab0  #24242e   #24242e
client.urgent           #f0607a  #f0607a  #000000  #f0607a   #f0607a

# Cursor
seat * xcursor_theme Bibata-Modern-Classic 24
