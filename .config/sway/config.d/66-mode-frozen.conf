# Freeze mode: keyboard and mouse blocked, screen stays visible.
# Entered and left with $mod+Ctrl+Escape (60-bindings.conf); everything is
# done by $scripts/freeze.sh, which also disables pointer/touchpad input and
# starts the overlay that swallows unbound keys.
#
# Bindings are per mode, so the media keys are repeated here, copied from
# /usr/share/sway/config.d/60-bindings-{volume,brightness,media}.conf and
# 60-bindings.conf (their variables are set there; 60 sorts before 66).

mode "frozen" {
    bindsym $mod+Ctrl+Escape exec $scripts/freeze.sh off

    # Lid closed: lock as usual; still frozen after unlocking
    bindswitch --locked lid:on exec loginctl lock-session

    bindsym --locked {
        XF86AudioRaiseVolume exec \
            $volume_helper_cmd --limit "$volume_limit" --increase "$volume_step"
        XF86AudioLowerVolume exec \
            $volume_helper_cmd --limit "$volume_limit" --decrease "$volume_step"
        XF86AudioMute    exec pactl set-sink-mute @DEFAULT_SINK@ toggle && $volume_helper_cmd
        XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle

        XF86AudioPlay    exec playerctl play-pause
        XF86AudioStop    exec playerctl stop

        $mod+less        exec playerctl -p playerctld previous
        $mod+z           exec playerctl -p playerctld play-pause
        $mod+x           exec playerctl -p playerctld next
    }

    bindsym {
        XF86MonBrightnessDown exec \
            'STEP="$brightness_step" && brightnessctl -q set ${STEP:-5}%- && $brightness_notification_cmd'
        XF86MonBrightnessUp exec \
            'STEP="$brightness_step" && brightnessctl -q set +${STEP:-5}% && $brightness_notification_cmd'

        XF86AudioForward exec playerctl position +10
        XF86AudioNext    exec playerctl next
        XF86AudioPause   exec playerctl pause
        XF86AudioPrev    exec playerctl previous
        XF86AudioRewind  exec playerctl position -10
    }
}
