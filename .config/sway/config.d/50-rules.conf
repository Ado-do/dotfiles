# Sway rules

# Force floating for small popups (GDB windows, etc)
for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="About"] floating enable

# Inhibit idle only for media/games (browsers: see 50-rules-browser.conf)
# Anything else in fullscreen (terminals, editors) still locks normally.
for_window [app_id="(?i)^(mpv|vlc|org\.videolan\.vlc|stremio|com\.stremio\.stremio)$"] inhibit_idle fullscreen
for_window [class="(?i)^(mpv|vlc|stremio|steam_app_.*)$"] inhibit_idle fullscreen
for_window [app_id="(?i)^zoom$"] inhibit_idle visible
for_window [class="(?i)^zoom$"] inhibit_idle visible
for_window [class="^dusk$"] inhibit_idle visible

# Assign workspaces
assign [class="^steam$"] workspace 8
assign [app_id="^vesktop$"] workspace 7
assign [class="^vesktop$"] workspace 7
assign [app_id="^rmpc$"] workspace 9
assign [app_id="^sys_btop$"] workspace 10

# Floating windows
#for_window [app_id="nemo"] floating enable, move absolute position centered, resize set 80 ppt 95 ppt
for_window [app_id="^(blueman-manager|org\.blueman\.Manager)$"] floating enable, move absolute position centered
for_window [app_id="^(nm-connection-editor|org\.gnome\.nm_connection_editor)$"] floating enable
for_window [app_id="^float_foot$"] floating enable, resize set 720 420, move position 100 ppt 100 ppt, move left 740, move up 440
for_window [app_id="^float_todo$"] floating enable, resize set 720 420, move position center
# Panels (scripts/panel.sh: $mod+n mode and waybar clicks)
for_window [app_id="^float_panel$"] floating enable, resize set 1000 650, move position center
for_window [app_id="^org\.localsend\.localsend_app$"] floating enable, resize set 900 650, move position center
for_window [class="^steam$" title="^Friends List$"] floating enable
for_window [class="^steam$" title="^Steam Settings$"] floating enable
for_window [class="^GalaxyBudsClient$"] floating enable
#for_window [app_id="firefox" title="^Picture-in-Picture$"] floating enable
for_window [app_id="^org\.matplotlib\.Matplotlib3$"] floating enable
for_window [app_id="^webcam$"] floating enable, sticky enable, resize set 480 270, move position 100 ppt 0 ppt, move left 500, move down 15
