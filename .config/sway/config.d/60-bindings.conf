## Sway Bindings
# Describe exec binds with a trailing "# ..." (shown in the $mod+? help menu).
# Sway commands can't take one: sway errors on the "#".

# move/resize windows with mouse
floating_modifier $mod normal

# workspace auto back and forth
#workspace_auto_back_and_forth yes

# directional focus wraps inside the workspace instead of jumping to another output
focus_wrapping workspace

# Apps, tools and session
bindsym {
    # Help & config
    $mod+question       exec $scripts/keybind-help.sh # keybinding help (Enter runs, Alt+e edits)
    $mod+slash          exec "$term nvim ~/.config/sway/config.d/60-bindings.conf" # edit bindings
    $mod+Alt+slash      exec "$term nvim ~/.config/sway/config.d" # edit sway config
    $mod+comma          exec $scripts/window-switch.sh # window switcher

    # Apps
    $mod+d              exec $menu # launcher
    $mod+Return         exec $term # terminal
    $mod+Alt+Return     exec $float_term # floating terminal
    $mod+Shift+f        exec foot -a yazi yazi # file manager (yazi)
    $mod+Shift+b        exec firefox # browser
    $mod+Shift+d        exec $scripts/focus-or-run.sh '[app_id="^discord$"]' 7 flatpak run com.discordapp.Discord # Vesktop: focus, or open on workspace 7
    $mod+Shift+g        exec $scripts/focus-or-run.sh '[class="^steam$" title="^Steam$"]' 8 $games # Steam: focus, or open on workspace 8
    $mod+m              exec $scripts/focus-or-run.sh '[app_id="^rmpc$"]' 9 $music_player # rmpc: focus, or open on workspace 9
    $mod+backslash      exec $scripts/focus-or-run.sh '[app_id="^sys_btop$"]' 10 foot -a sys_btop btop # btop: focus, or open on workspace 10
    $mod+Shift+r        exec obs # OBS

    # Notes and other personal-path bindings: 61-bindings-local.conf (untracked)

    # Tools
    $mod+Shift+v        exec $clipboard # clipboard history
    $mod+o              exec $scripts/display-toggle.sh # toggle display setup
    $mod+a              exec $scripts/toggle-audio.sh # switch audio output
    $mod+Alt+b          exec bluetooth toggle # toggle bluetooth (tlp)
    $mod+Alt+p          exec $scripts/power-profile.sh # cycle power profile (tlp)
    $mod+Alt+f          exec $scripts/float-window-persist.sh # always float this window
    $mod+Shift+t        exec ~/.config/waybar/scripts/theme.sh # waybar theme switcher
    $mod+Alt+r          exec obs-cmd recording toggle # start/stop OBS recording
    $mod+Alt+c          exec $scripts/calendar-popup.py # calendar popup (Enter opens calcure)

    # Notifications
    $mod+Backspace      exec dunstctl close # close the top notification
    $mod+Shift+Backspace exec dunstctl close-all # close all notifications
    $mod+Alt+Backspace  exec dunstctl set-paused toggle && pkill -RTMIN+8 waybar # mute notifications
    $mod+equal          exec dunstctl context # context menu (useful for clicking links in notifications)
    $mod+Alt+equal      exec dunstctl history-pop # show notification history

    # Media (layout-independent: US and Latam)
    --locked $mod+less  exec playerctl -p playerctld previous # previous track
    --locked $mod+z     exec playerctl -p playerctld play-pause # play/pause
    --locked $mod+x     exec playerctl -p playerctld next # next track

    # Session
    $mod+Shift+q        kill
    $mod+Shift+c        reload
    $mod+Escape         exec loginctl lock-session # lock screen
    $mod+Shift+Escape   exec $scripts/power-menu.sh # power menu
    $mod+Alt+Escape     exec $scripts/idle.sh toggle # toggle always awake
    $mod+Ctrl+Escape    exec $scripts/freeze.sh toggle # freeze keyboard and mouse, screen stays visible
}

# Window management
bindsym {
    # Focus
    $mod+$left          focus left
    $mod+$down          focus down
    $mod+$up            focus up
    $mod+$right         focus right
    $mod+Alt+Tab        focus next
    $mod+Shift+Tab      focus prev
    $mod+Tab            exec $scripts/ws-per-output.sh back # previous workspace on this output
    $mod+grave          exec $scripts/ws-per-output.sh output # focus next output

    # Move (Ctrl: move the window and follow it)
    $mod+Shift+$left    move left
    $mod+Shift+$down    move down
    $mod+Shift+$up      move up
    $mod+Shift+$right   move right
    $mod+Ctrl+$right    move container to workspace next_on_output; workspace next_on_output
    $mod+Ctrl+$left     move container to workspace prev_on_output; workspace prev_on_output
    $mod+Ctrl+o         move container to output right; focus output right

    # Workspaces
    $mod+Alt+$right     workspace next_on_output
    $mod+Alt+$left      workspace prev_on_output
    $mod+Shift+o        move workspace to output right
    $mod+1              workspace number 1
    $mod+2              workspace number 2
    $mod+3              workspace number 3
    $mod+4              workspace number 4
    $mod+5              workspace number 5
    $mod+6              workspace number 6
    $mod+7              workspace number 7
    $mod+8              workspace number 8
    $mod+9              workspace number 9
    $mod+0              workspace number 10

    # Move window to workspace (and follow it)
    $mod+Shift+1        move container to workspace number 1; workspace number 1
    $mod+Shift+2        move container to workspace number 2; workspace number 2
    $mod+Shift+3        move container to workspace number 3; workspace number 3
    $mod+Shift+4        move container to workspace number 4; workspace number 4
    $mod+Shift+5        move container to workspace number 5; workspace number 5
    $mod+Shift+6        move container to workspace number 6; workspace number 6
    $mod+Shift+7        move container to workspace number 7; workspace number 7
    $mod+Shift+8        move container to workspace number 8; workspace number 8
    $mod+Shift+9        move container to workspace number 9; workspace number 9
    $mod+Shift+0        move container to workspace number 10; workspace number 10

    # Layout
    $mod+b              splith
    $mod+v              splitv
    $mod+s              layout stacking
    $mod+w              layout tabbed
    $mod+e              layout toggle split
    $mod+f              fullscreen
    $mod+Shift+Space    floating toggle
    $mod+Space          focus mode_toggle
    $mod+Shift+s        sticky toggle
    $mod+p              focus parent
    $mod+c              focus child

    # Scratchpad (show cycles through scratchpad windows)
    $mod+Shift+minus    move scratchpad
    $mod+minus          scratchpad show
}

# Modes

# Resize mode
mode "resize" {
    set $d1 20px
    bindsym $left resize shrink width $d1
    bindsym $down resize grow height $d1
    bindsym $up resize shrink height $d1
    bindsym $right resize grow width $d1

    set $d2 100px
    bindsym Shift+$left resize shrink width $d2
    bindsym Shift+$down resize grow height $d2
    bindsym Shift+$up resize shrink height $d2
    bindsym Shift+$right resize grow width $d2

    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}
bindsym $mod+r mode "resize"

# Panels mode (wifi / mixer / bluetooth / monitor / calendar): $mod+n, then a single key.
# Pressing the key again just focuses the panel if it's already open.
mode "panels" {
    bindsym w exec $scripts/panel.sh Wi-Fi wlctl; mode "default"
    bindsym a exec $scripts/panel.sh Mixer wiremix; mode "default"
    bindsym b exec $scripts/panel.sh Bluetooth bluetui; mode "default"
    bindsym m exec $scripts/panel.sh Monitor btop; mode "default"
    bindsym c exec $scripts/panel.sh Calendar calcure; mode "default"

    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+n mode "default"
}
bindsym $mod+n mode "panels"

# vim: ft=swayconfig
