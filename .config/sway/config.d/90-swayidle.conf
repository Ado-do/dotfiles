# Idle and lock. Replaces Fedora's file of the same name (/usr/share/sway/config.d).
# Lock now: $mod+Escape (loginctl lock-session). swaylock settings: ~/.config/swaylock/config
# Requires: swayidle, swaylock, brightnessctl

# Idle timeouts run in their own swayidle so they can be toggled off
# ("always awake", $mod+Alt+Escape / waybar). Timeouts are set in the script.
exec $scripts/idle.sh start

# Locking on sleep / lock-session always stays active. The keyboard backlight
# level is saved before suspend and put back after resume (the firmware doesn't).
exec swayidle -w \
    before-sleep 'swaylock -f; $scripts/kbd-backlight.sh off sleep' \
    after-resume '$scripts/kbd-backlight.sh restore resume' \
    lock 'swaylock -f' \
    unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'

# Lock when the lid closes. Normally logind suspends anyway; when it ignores
# the lid (systemd-inhibit --what=handle-lid-switch, see claude-away alias)
# this keeps the session locked.
bindswitch --reload --locked lid:on exec loginctl lock-session
