# Sway Variables

# basic motions
set $mod Mod4
set $left h
set $down j
set $up k
set $right l

# my programs
set $term foot
set $float_term     foot -a 'float_foot' -o 'font=IosevkaTerm NF:weight=medium:size=11'
set $todo_term      foot -a 'float_todo' -o 'font=IosevkaTerm NF:weight=medium:size=11'
set $clipboard      ~/.config/fuzzel/cliphist-fuzzel-img
set $music_player   foot -a 'rmpc' -o 'font=IosevkaTerm NF:weight=medium:size=18' rmpc
#set $music_player   flatpak run io.github.lullabyX.sone
#set $music_player   oxitide
set $games          steam

# my launcher
#set $rofi_cmd rofi -terminal '$term'
#set $menu $rofi_cmd -show combi -combi-modes drun#run -modes combi
set $menu fuzzel --mesg='Launcher'

# my scripts
set $scripts ~/.config/sway/scripts

