# Sway autostart weas

# Screen brightness at login
exec brightnessctl set 25%

# Nightlight setup
exec wlsunset -s 21:00 -S 07:00 -d 1800 -g 0.8

# Start cliphist daemon for text and images
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# Keep clipboard contents alive after the source app hides/closes
# (fixes Ente Auth / other Flutter apps leaving the clipboard empty)
exec wl-clip-persist --clipboard regular

# Power notification daemon
exec $scripts/power-monitor.sh

# Per-output workspace history (for $mod+Alt+Tab)
exec $scripts/ws-per-output.sh daemon
