# Sway inputs

# Keyboard
input "type:keyboard" {
    xkb_layout us,latam
    xkb_model asus_laptop

    # grp:shifts_toggle: press both Shift keys to switch layout
    xkb_options caps:escape_shifted_capslock,compose:ins,grp:shifts_toggle
}

# Touchpad
input "type:touchpad" {
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
    dwt disabled
}
