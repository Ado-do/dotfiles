# Screenshot bindings (scripts/screenshot.sh: grim + slurp)
# Replaces Fedora's file of the same name (/usr/share/sway/config.d), which used grimshot.
# Saved to $XDG_SCREENSHOTS_DIR (default ~/Pictures/Screenshots), linked as
# last_ss.png and copied to the clipboard.

bindsym {
    Print       exec $scripts/screenshot.sh screen # screenshot: all outputs
    Alt+Print   exec $scripts/screenshot.sh window # screenshot: focused window
    Shift+Print exec $scripts/screenshot.sh area # screenshot: select an area
}
