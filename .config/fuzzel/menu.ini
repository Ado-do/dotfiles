# Overlay for non-launcher menus (power, display, audio, windows, ...).
# Usage: fuzzel --config ~/.config/fuzzel/menu.ini --dmenu --mesg "Title"
# Inherits fuzzel.ini (font, colors, custom-N keybinds) and overrides the look.
include=~/.config/fuzzel/fuzzel.ini

prompt="❯ "
icon-theme=Papirus-Dark
# shrink short menus to their item count
minimal-lines=yes
inner-pad=6

[colors]
# title (--mesg) and prompt
message=7a7a96ff
prompt=7a7a96ff
# sway client.focused border; callers pass --border-color=f0607aff for destructive menus
border=50506cff

[border]
width=2
selection-radius=6
